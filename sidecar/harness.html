<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Verification</title>
  <!--
    官方 Cloudflare Turnstile 与 Castle SDK（走与业务同一条代理链路加载）。

    注意：Turnstile 的 api.js **不能**带 async/defer —— 使用 render=explicit 时，
    带 async/defer 会导致 turnstile.render() 静默失败（不创建 iframe、不触发
    error-callback、token 永不返回），官方也会在 turnstile.ready() 时直接抛
    "Remove async/defer from the Turnstile api.js script tag"。
  -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
  <script src="https://d2t77mnxyo7adj.cloudfront.net/v1/c.js"></script>
  <style>
    html, body {
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    #container { text-align: center; }
  </style>
</head>
<body>
  <div id="container">
    <div id="cf-turnstile-widget"></div>
    <!-- 自检专用容器：Turnstile 不允许同一容器在 render/execute 之间更换 sitekey，
         因此自检（官方测试 key）必须用独立容器，避免与真实 sitekey 互相污染 -->
    <div id="cf-turnstile-selftest" style="display:none"></div>
  </div>

  <script>
    window._turnstileToken = null;
    window._turnstileError = null;
    window._widgetId = null;
    window._widgetIds = {};
    // 按容器隔离 token/error，避免「真实 sitekey 的 widget」与「自检 widget」互相串读
    window._turnstileTokens = {};
    window._turnstileErrors = {};
    window._castleConfigured = false;
    window._castleLastError = null;

    // 1. 初始化 Castle SDK（publishable key 由 Python 侧注入）
    function initCastle(publishableKey) {
      if (!window._castle) {
        return false;
      }
      try {
        window._castle('configure', { pk: publishableKey });
        window._castleConfigured = true;
        return true;
      } catch (err) {
        window._castleLastError = String((err && err.message) || err);
        return false;
      }
    }

    // 2. 提取 Castle Request Token（真实渲染管线 + 真实 Canvas/WebGL 熵）
    //
    // 注意：Castle 的 createRequestToken() 返回的是**自定义 thenable**（只有 then，
    // 没有 catch），所以必须用 then(onFulfilled, onRejected) 两参形式；同时加一个
    // JS 侧超时，避免 SDK 不兑现时把 Python 侧挂死。
    function acquireCastleToken(timeoutMs) {
      return new Promise((resolve, reject) => {
        if (!window._castle) {
          reject(new Error('Castle SDK not loaded'));
          return;
        }
        if (!window._castleConfigured) {
          reject(new Error('Castle SDK not configured'));
          return;
        }
        let settled = false;
        const finish = (fn, value) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          fn(value);
        };
        const timer = setTimeout(
          () => finish(reject, new Error('Castle createRequestToken timeout')),
          Math.max(1000, timeoutMs || 15000)
        );
        try {
          const result = window._castle('createRequestToken');
          if (result && typeof result.then === 'function') {
            result.then(
              function (token) { finish(resolve, token); },
              function (err) {
                window._castleLastError = String((err && err.message) || err);
                finish(reject, err);
              }
            );
          } else if (typeof result === 'string') {
            finish(resolve, result);
          } else {
            finish(reject, new Error('Castle returned unsupported value: ' + typeof result));
          }
        } catch (err) {
          window._castleLastError = String((err && err.message) || err);
          finish(reject, err);
        }
      });
    }

    // 3. 渲染 Turnstile 挑战，token 通过全局变量回传给 Python
    //    containerSelector 允许调用方指定容器（自检用独立容器，避免 sitekey 冲突）
    function renderTurnstile(sitekey, action, containerSelector) {
      window._turnstileToken = null;
      window._turnstileError = null;
      const selector = containerSelector || '#cf-turnstile-widget';
      if (!window.turnstile) {
        window._turnstileError = 'TURNSTILE_SDK_NOT_LOADED';
        return false;
      }
      // 同一容器复用前必须 remove（不是 reset），否则 Turnstile 会拒绝更换 sitekey
      const previous = window._widgetIds[selector];
      if (previous !== undefined && previous !== null) {
        try { window.turnstile.remove(previous); } catch (err) { /* ignore */ }
        delete window._widgetIds[selector];
      }
      try {
        const widgetId = window.turnstile.render(selector, {
          sitekey: sitekey,
          action: action || undefined,
          theme: 'dark',
          callback: function (token) {
            window._turnstileTokens[selector] = token;
            window._turnstileToken = token;
          },
          'error-callback': function (code) {
            window._turnstileErrors[selector] = code || 'UNKNOWN_ERROR';
            window._turnstileError = code || 'UNKNOWN_ERROR';
          },
          'expired-callback': function () {
            window._turnstileTokens[selector] = null;
            window._turnstileToken = null;
          }
        });
        window._widgetIds[selector] = widgetId;
        window._widgetId = widgetId;
      } catch (err) {
        window._turnstileError = 'RENDER_FAILED: ' + String((err && err.message) || err);
        return false;
      }
      return window._widgetIds[selector] !== null && window._widgetIds[selector] !== undefined;
    }

    // 4. 环境自检：供 Python 侧判断页面是否真的就绪
    function harnessStatus() {
      return {
        turnstile: typeof window.turnstile !== 'undefined',
        castle: typeof window._castle !== 'undefined',
        castleConfigured: window._castleConfigured,
        webdriver: navigator.webdriver,
        hardwareConcurrency: navigator.hardwareConcurrency,
        userAgent: navigator.userAgent,
        viewport: { width: window.innerWidth, height: window.innerHeight },
        screen: { width: window.screen.width, height: window.screen.height },
        languages: navigator.languages ? Array.from(navigator.languages) : []
      };
    }
  </script>
</body>
</html>
